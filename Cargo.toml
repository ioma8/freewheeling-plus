[package]
name = "freewheeling-plus"
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
default-run = "freewheeling-plus"

[lib]
crate-type = ["cdylib", "rlib"]

[features]
default = []
jack = ["dep:jack"]

# The realtime DSP runs on CoreAudio's 512 KiB IO thread. Debug builds (opt 0)
# give the huge audio-callback match functions frames over a megabyte because
# stack slots are never reused; opt-level 1 collapses those frames so the app
# and its tests cannot overflow the audio thread. Realtime behavior is
# unaffected (release builds are unchanged).
[profile.dev]
opt-level = 1

# The release DSP path spans core_dsp, the native graph, and the audio
# adapters. Thin LTO lets the optimizer inline across those crate boundaries
# without the link-time cost of full LTO, which keeps the realtime callback
# hot while release CI stays fast.
[profile.release]
lto = "thin"

[dependencies]
libc = "0.2"
roxmltree = "0.20"
hound = "3.5"
vorbis_rs = "0.5.5"
flacenc = "0.5.1"
claxon = "0.4.3"
md-5 = "0.10.6"
crossbeam-queue = "0.3.12"
cpal = "0.18.1"
midir = "0.11.0"
sdl2 = { version = "0.38.0", features = ["bundled", "static-link"] }
fluidlite = { version = "0.2.1", features = ["bindgen", "builtin"] }
fontdue = "0.9.3"
image = { version = "0.25.10", default-features = false, features = ["jpeg", "png"] }
rtrb = "0.3.4"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[dev-dependencies]
sha2 = "0.10"

[target.'cfg(any(target_os = "linux", target_os = "macos", target_os = "windows"))'.dependencies]
jack = { version = "0.13.5", optional = true }

[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6"
objc2-foundation = "0.3"
objc2-app-kit = "0.3"
core-foundation = "0.10"
coreaudio-sys = { version = "0.2", features = ["audio_unit"] }

[target.'cfg(target_os = "linux")'.dependencies]
alsa = "0.11.0"

[target.'cfg(target_os = "android")'.dependencies]
ndk-context = "0.1"
jni-sys = "0.4"
# Enable ndk's API-28 audio bindings (AAudio input preset). cpal only enables
# api-level-26, which leaves AudioInputPreset cfg'd out; feature unification
# makes the AAudio UNPROCESSED input preset available to the cpal registry
# patch in android-build.sh so the looper records the raw microphone instead
# of the VOICE_RECOGNITION voice-processing path.
ndk = { version = "0.9", default-features = false, features = ["api-level-28"] }

[package.metadata.bundle]
name = "FreeWheeling"
identifier = "org.freewheeling.freewheeling-plus"
category = "public.app-category.music"
short_description = "Live looping instrument"
copyright = "FreeWheeling contributors"
osx_minimum_system_version = "11.0"
resources = ["data"]

[package.metadata.android]
package = "org.freewheeling.freewheeling_plus"
sdk.min_sdk_version = 34
sdk.target_sdk_version = 34
assets = "data/"
