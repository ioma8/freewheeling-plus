name: Release builds

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      version:
        description: Release version
        required: true
        type: string

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always
  RELEASE_VERSION: ${{ inputs.version || github.ref_name }}

jobs:
  linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Install build dependencies
        run: sudo apt-get update && sudo apt-get install -y libasound2-dev
      - name: Package Linux release
        run: FWP_VERSION="${RELEASE_VERSION#v}" scripts/linux/package-release.sh
      - uses: actions/upload-artifact@v7
        with:
          name: freewheeling-plus-linux-x86_64
          path: dist/*.tar.gz*
          if-no-files-found: error

  macos:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v7
      - name: Install Rust targets and cargo-bundle
        run: |
          rustup target add aarch64-apple-darwin x86_64-apple-darwin
          cargo install cargo-bundle --version 0.11.0 --locked
      - name: Package universal macOS DMG
        run: FWP_VERSION="${RELEASE_VERSION#v}" scripts/package-macos-universal.sh
      - uses: actions/upload-artifact@v7
        with:
          name: freewheeling-plus-macos-universal
          path: target/aarch64-apple-darwin/release/bundle/osx/FreeWheeling-*-universal.dmg
          if-no-files-found: error

  release:
    needs: [linux, macos]
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v7
        with:
          pattern: freewheeling-plus-*
          path: release-assets
          merge-multiple: true
      - name: Create draft GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: gh release create "$GITHUB_REF_NAME" --draft --generate-notes release-assets/*
